<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101319; color: #e9edf3; font: 16px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
  #score { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  #board { position: relative; width: 480px; height: 480px; background: #171d27;
           border: 2px solid #2b333f; border-radius: 8px; overflow: hidden; }
  .cell { position: absolute; }
  .snake { background: #63d493; }
  .head { background: #8bf0b6; }
  .food { background: #e2593c; border-radius: 50%; }
  #over { color: #ff8f76; font-weight: 700; letter-spacing: .08em; display: none; }
  p { margin: 0; font-size: 12px; opacity: .55; }
</style>
</head>
<body>
  <!-- POSITIVE CONTROL, DOM VARIANT (lane E2). Same game, painted as absolutely-positioned divs with
       NO canvas at all — which is exactly the shape that sends the driver to its blind sweep fallback.
       Its point is to prove that fallback can also put food in the snake's mouth, so the driver is
       green on both rendering styles and neither arm rides on the other's luck. -->
  <div id="score">Score: 0</div>
  <div id="board"></div>
  <div id="over">GAME OVER — press Enter</div>
  <p>Arrow keys or WASD to steer</p>
  <script>
    (() => {
      const CELL = 24, COLS = 20, ROWS = 20, TICK = 120;
      const board = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const overEl = document.getElementById("over");
      let snake, dir, food, score, timer = null, dead = false;

      function render() {
        board.textContent = "";
        const place = (x, y, cls) => {
          const cell = document.createElement("div");
          cell.className = "cell " + cls;
          cell.style.left = (x * CELL + 2) + "px";
          cell.style.top = (y * CELL + 2) + "px";
          cell.style.width = (CELL - 4) + "px";
          cell.style.height = (CELL - 4) + "px";
          board.appendChild(cell);
        };
        if (food) place(food.x, food.y, "food");
        snake.forEach((s, i) => place(s.x, s.y, i === 0 ? "head" : "snake"));
      }

      function placeFood() {
        const free = [];
        for (let y = 0; y < ROWS; y += 1) for (let x = 0; x < COLS; x += 1) {
          if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
        }
        food = free[Math.floor(Math.random() * free.length)];
      }

      function die() {
        dead = true;
        if (timer) { clearInterval(timer); timer = null; }
        overEl.style.display = "block";
      }

      function step() {
        if (dead) return;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const intoWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
        const intoSelf = snake.some((s) => s.x === head.x && s.y === head.y);
        if (intoWall || intoSelf) { die(); return; }
        snake.unshift(head);
        if (food && head.x === food.x && head.y === food.y) {
          score += 1;
          scoreEl.textContent = "Score: " + score;
          placeFood();
        } else {
          snake.pop();
        }
        render();
      }

      function reset() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        dir = { x: 1, y: 0 };
        score = 0;
        dead = false;
        scoreEl.textContent = "Score: 0";
        overEl.style.display = "none";
        placeFood();
        render();
        if (timer) clearInterval(timer);
        timer = setInterval(step, TICK);
      }

      const KEYS = {
        ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
        w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
      };
      addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === "r" || event.key === "R") { reset(); return; }
        const delta = KEYS[event.key];
        if (!delta || dead) return;
        if (delta[0] === -dir.x && delta[1] === -dir.y) return;
        dir = { x: delta[0], y: delta[1] };
      });

      reset();
    })();
  </script>
</body>
</html>
