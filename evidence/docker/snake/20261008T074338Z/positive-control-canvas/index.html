<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1017; color: #e8ecf1; font: 16px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
  #hud { display: flex; gap: 22px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  canvas { background: #161b24; border-radius: 8px; display: block; }
  #over { display: none; font-size: 22px; font-weight: 700; letter-spacing: .08em; color: #ff8b73; }
  p { margin: 0; font-size: 12px; opacity: .55; }
</style>
</head>
<body>
  <!-- POSITIVE CONTROL (lane E2). This is a KNOWN-GOOD snake that the SAME driver is required to PASS,
       so a green verdict on the live artifact cannot be dismissed as "the harness fails everything".
       It renders to a canvas, paints its head in a different colour from its body, and draws faint
       gridlines across the whole board — three properties chosen on purpose to exercise the driver's
       pixel sensor rather than to make its life easy. -->
  <div id="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="board" width="480" height="480"></canvas>
  <div id="over">GAME OVER</div>
  <p>Arrow keys or WASD to steer &middot; Enter or R to restart</p>
  <script>
    (() => {
      const CELL = 24, COLS = 20, ROWS = 20, TICK = 110;
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overEl = document.getElementById("over");
      let snake, dir, food, score, best = 0, timer = null, dead = false;

      function placeFood() {
        const free = [];
        for (let y = 0; y < ROWS; y += 1) for (let x = 0; x < COLS; x += 1) {
          if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
        }
        food = free[Math.floor(Math.random() * free.length)];
      }

      function draw() {
        ctx.fillStyle = "#161b24";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#1e2530";
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i += 1) {
          ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, canvas.height); ctx.stroke();
        }
        for (let i = 1; i < ROWS; i += 1) {
          ctx.beginPath(); ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(canvas.width, i * CELL + 0.5); ctx.stroke();
        }
        if (food) { ctx.fillStyle = "#e0563f"; ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4); }
        snake.forEach((s, i) => {
          ctx.fillStyle = i === 0 ? "#7ef0ae" : "#5fd08a";
          ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
        });
        const head = snake[0];
        ctx.fillStyle = "#0d1017";
        ctx.fillRect(head.x * CELL + 8, head.y * CELL + 8, 4, 4);
        ctx.fillRect(head.x * CELL + 14, head.y * CELL + 8, 4, 4);
      }

      function die() {
        dead = true;
        if (timer) { clearInterval(timer); timer = null; }
        overEl.style.display = "block";
      }

      function step() {
        if (dead) return;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        const intoWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
        const intoSelf = snake.some((s) => s.x === head.x && s.y === head.y);
        if (intoWall || intoSelf) { die(); return; }
        snake.unshift(head);
        if (food && head.x === food.x && head.y === food.y) {
          score += 1;
          scoreEl.textContent = String(score);
          if (score > best) { best = score; bestEl.textContent = String(best); }
          placeFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function reset() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        dir = { x: 1, y: 0 };
        score = 0;
        dead = false;
        scoreEl.textContent = "0";
        overEl.style.display = "none";
        placeFood();
        draw();
        if (timer) clearInterval(timer);
        timer = setInterval(step, TICK);
      }

      const KEYS = {
        ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
        w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
      };
      addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === "r" || event.key === "R") { reset(); return; }
        const delta = KEYS[event.key];
        if (!delta || dead) return;
        if (delta[0] === -dir.x && delta[1] === -dir.y) return;
        dir = { x: delta[0], y: delta[1] };
      });

      reset();
    })();
  </script>
</body>
</html>
