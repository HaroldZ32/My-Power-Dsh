# docker/docker-compose.yml — TWO services on ONE image, and neither mounts host harness state.
#
# THE ISOLATION RULE THIS FILE ENFORCES (AGENTS.md §7, task lane D): the only host path these
# services touch is the evidence mount ${MPD_DOCKER_OUT}. There is deliberately NO bind of $HOME,
# ~/.dsh, ~/.mpd, ~/.agents, the docker socket or the repository: the repository travels into the
# image as a COPY of the build context (filtered by docker/Dockerfile.dockerignore), so a container
# bug can never read or write the operator's harness home — which is what makes the entrypoint's
# isolation assertion meaningful instead of decorative. `node scripts/docker-e2e.ts --self-test`
# asserts this statically.
#
# THE TWO SERVICES ANSWER TWO DIFFERENT QUESTIONS, and the difference is the whole point:
#   · `mpd-client`   — can a checkout be installed by the client flow (`dsh plugin --profile web add
#                      <path>`), after `bun install` and a from-source rebuild of every dist entry?
#   · `mpd-oneclick` — can the PUBLISHED package be installed by a person who never clones it
#                      (`dsh plugin --profile web add <git spec>`), with NO build step at all, and
#                      does the installed tree carry every path its rows name and nothing the
#                      `files` allowlist excludes? This is the user-facing one-command path
#                      (`github:HaroldZ32/My-Power-Dsh`), reproduced locally against a scratch git
#                      repository the entrypoint builds from the same build context, so the evidence
#                      needs no network round trip to GitHub to be real.
#
# The build context is the REPOSITORY ROOT, and NOTHING is staged inside the repository: an earlier
# driver shape copied the tree into docker/src as the context, and that in-repo copy was picked up by
# `bun test`'s globs and by every tree-walking gate (measured 2026-09-27).
#
# SANCTIONED ONE COMMAND (source lane) and its one-click twin:
#     node scripts/docker-e2e.ts
#     node scripts/docker-e2e.ts --mode oneclick
# It builds this image, runs the chosen service and lands the evidence under
# evidence/docker/<lane>/<UTC stamp>/.
#
# RAW COMPOSE (the same stack, by hand):
#     docker compose -f docker/docker-compose.yml build
#     docker compose -f docker/docker-compose.yml run --rm mpd-client
#     MPD_E2E_INSTALL_MODE=oneclick docker compose -f docker/docker-compose.yml run --rm mpd-oneclick
# The harness pin is `MPD_E2E_DSH_VERSION` (default 0.2.1-rc.2). It MUST be declared below as well as
# read by the entrypoint: compose only forwards what this file interpolates, so a knob named only in
# docker/entrypoint.sh is UNREACHABLE from the host — measured 2026-09-29, when a lane exported
# MPD_E2E_DSH_VERSION=0.2.0-rc.1 and the container still installed the default, which made the run
# look like a 0.2.0-rc.1 verification while its own evidence said `harnessVersion: 0.1.7-rc.2`.
# A directory outside the repository cannot be written by the sandboxed docker CLI, so if the build
# fails with `mkdir <home>/.docker/buildx: read-only file system`, point BUILDX_CONFIG at a writable
# directory; the driver does exactly that by itself.
services:
  mpd-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mpd-docker-e2e:local
    # No init shim and no TTY: the entrypoint IS the process, and its exit code is the verdict.
    init: false
    tty: false
    environment:
      MPD_E2E_OUT: /out
      # Which harness release the container installs (and asserts against). Exported by the driver.
      # 0.2.1-rc.2 is the pinned baseline: the `mpd` preset plane now declares rows that exist only in
      # harness 0.2.1 (`time-context`, `tool-schedule`, `tool-plugin-market`), so a 0.2.0 harness can
      # no longer mount the preset at all — the default must track the harness this bundle targets.
      MPD_E2E_DSH_VERSION: ${MPD_E2E_DSH_VERSION:-0.2.1-rc.2}
      # Which DSH-TUI host the TUI lane installs. It MUST accept the harness pin's peer range:
      # 0.16.1 is the first host whose 36 declared `@deepseek-ai/dsh-*` peers ALL include harness
      # 0.2.1-rc.2, so it serves both the 0.2.0-rc.2 baseline and the 0.2.1 wave. 0.15.0 covers only
      # 0.1.7-rc.1 through 0.2.0-rc.2, and 0.11.2 stops at 0.2.0-rc.1 — measured 2026-10-02 that a TUI
      # pin whose peer range excludes the harness pin is REFUSED by `dsh plugin --profile dsh-tui add`,
      # so these two knobs move together.
      MPD_E2E_TUI_VERSION: ${MPD_E2E_TUI_VERSION:-0.16.1}
      # THE TASK THE LIVE TURN RUNS (docker/entrypoint.sh step 15). OPTIONAL and empty by default:
      # an empty string is what makes the entrypoint keep its own default team-plane prompt
      # byte-for-byte, so every existing live arm keeps its present meaning. It MUST be interpolated
      # HERE for the same measured reason as the pin above — compose forwards only what this file
      # names, so a knob read solely by the entrypoint is unreachable from the host. The `:-` form is
      # load-bearing: without it compose would warn about an unset variable and hand the container
      # NOTHING, which would look identical to the default while proving nothing.
      MPD_E2E_LIVE_PROMPT: ${MPD_E2E_LIVE_PROMPT:-}
      # THE LIVE TEAM PROJECT (docker/entrypoint.sh, docker/lib/team-project-verdict.ts). `1` asks BOTH
      # UI planes to build a real two-member team and a small tested project through their own input
      # path; unset/0 leaves every existing arm byte-for-byte. The budget is its own because a team
      # turn spans approval, two raises, two dispatches and two member turns. BOTH are interpolated
      # HERE for the measured compose reason above: a knob only the entrypoint reads is unreachable.
      MPD_E2E_TEAM_PROJECT: ${MPD_E2E_TEAM_PROJECT:-}
      MPD_E2E_TEAM_BUDGET_MS: ${MPD_E2E_TEAM_BUDGET_MS:-1500000}
      # THE NPM TRANSPORT (2026-10-09, measured: the official registry's scoped-metadata endpoint
      # answered in 1.5 s once and FAILED on the next probe, and npm retried a failure like that for 23
      # minutes at 0.3% CPU until the run had to be killed). `MPD_E2E_NPM_REGISTRY` names a registry to
      # use INSTEAD of the official one; left empty, the entrypoint probes the official registry's
      # scoped endpoint and falls back to `MPD_E2E_NPM_MIRROR` only when it does not answer, recording
      # the registry it actually used as `obs.npmRegistry`. Both must be interpolated HERE: compose
      # forwards only what this file names, and a knob the entrypoint alone reads is unreachable.
      MPD_E2E_NPM_REGISTRY: ${MPD_E2E_NPM_REGISTRY:-}
      MPD_E2E_NPM_MIRROR: ${MPD_E2E_NPM_MIRROR:-}
      # The budget for ONE `run_step`, so a stalled network command fails fast instead of costing the run.
      MPD_E2E_STEP_TIMEOUT: ${MPD_E2E_STEP_TIMEOUT:-}
    volumes:
      # The driver points this at evidence/docker/client-install/<stamp>/; the default keeps
      # `docker compose run` usable by hand and writes ./docker/out.
      - ${MPD_DOCKER_OUT:-./out}:/out

  # The one-command user install: same image, same entrypoint, a different INSTALL MODE. The
  # entrypoint builds a scratch git repository from the build context inside the container and
  # installs THAT, so pnpm's git-hosted resolver — the code path a `github:` spec takes — filters the
  # package through the manifest's `files` allowlist exactly as it would for a real user.
  mpd-oneclick:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mpd-docker-e2e:local
    init: false
    tty: false
    environment:
      MPD_E2E_INSTALL_MODE: oneclick
      # The spec under test. `git+file:///opt/oneclick.git` is the local stand-in for
      # `github:HaroldZ32/My-Power-Dsh`; set MPD_ONECLICK_SPEC to the GitHub spec to run the very
      # same assertions against the published repository.
      MPD_E2E_INSTALL_SPEC: ${MPD_ONECLICK_SPEC:-git+file:///opt/oneclick.git}
      MPD_E2E_OUT: /out
      MPD_E2E_DSH_VERSION: ${MPD_E2E_DSH_VERSION:-0.2.1-rc.2}
      MPD_E2E_TUI_VERSION: ${MPD_E2E_TUI_VERSION:-0.16.1}
      # Same optional live-turn prompt as `mpd-client` (see the comment there): both services run the
      # SAME entrypoint and therefore share step 15, so a knob named on only one of them would make
      # the prompt depend on which service the operator drove.
      MPD_E2E_LIVE_PROMPT: ${MPD_E2E_LIVE_PROMPT:-}
      # Same live-team-project knobs as `mpd-client` (see the comment there): both services run the
      # SAME entrypoint, so a knob named on only one of them would make the run depend on the service.
      MPD_E2E_TEAM_PROJECT: ${MPD_E2E_TEAM_PROJECT:-}
      MPD_E2E_TEAM_BUDGET_MS: ${MPD_E2E_TEAM_BUDGET_MS:-1500000}
      # THE NPM TRANSPORT (2026-10-09, measured: the official registry's scoped-metadata endpoint
      # answered in 1.5 s once and FAILED on the next probe, and npm retried a failure like that for 23
      # minutes at 0.3% CPU until the run had to be killed). `MPD_E2E_NPM_REGISTRY` names a registry to
      # use INSTEAD of the official one; left empty, the entrypoint probes the official registry's
      # scoped endpoint and falls back to `MPD_E2E_NPM_MIRROR` only when it does not answer, recording
      # the registry it actually used as `obs.npmRegistry`. Both must be interpolated HERE: compose
      # forwards only what this file names, and a knob the entrypoint alone reads is unreachable.
      MPD_E2E_NPM_REGISTRY: ${MPD_E2E_NPM_REGISTRY:-}
      MPD_E2E_NPM_MIRROR: ${MPD_E2E_NPM_MIRROR:-}
      # The budget for ONE `run_step`, so a stalled network command fails fast instead of costing the run.
      MPD_E2E_STEP_TIMEOUT: ${MPD_E2E_STEP_TIMEOUT:-}
    volumes:
      - ${MPD_DOCKER_OUT:-./out}:/out
