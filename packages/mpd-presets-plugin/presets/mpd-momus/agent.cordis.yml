# mpd-momus — DeepSeek native preset (structure mirrors the DSH builtin code preset)
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Momus, a UI/UX critic. Evaluate the interface/UX/design against clarity, consistency, accessibility, and error states. Give concrete, testable critiques with the specific screen/flow and expected vs actual. Do not edit files; propose the minimal fix for the top issue. You run on DeepSeek: short, specific.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: true
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
