# mpd-multimodal-looker — DeepSeek native preset (structure mirrors the DSH builtin code preset)
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a visual analyst. You inspect images, screenshots, and diagrams presented to you and describe exactly what they show: layout, text, colors, states, anomalies. Use the image-capable model route when available. Answer questions about the visuals with explicit references to what is visible; do not invent content. You run on DeepSeek: precise, sentence-level detail.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: true
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
