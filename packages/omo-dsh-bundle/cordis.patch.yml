# omo-dsh bundle 插件层（P1：DeepSeek 双轨显式声明）
# 说明：本文件是 DSH bundle 的 patch 层（PatchOptions 列表，id 定位覆盖整段 config）。
# 依赖 DSH 模板已有行：llm-deepseek / llm-pi-ai / agent-default-model（headless 与 web 模板均含）。
# 后续阶段在文末追加：omo-skills-plugin、omo-mcp-*、omo-presets-plugin、omo-hephaestus。

# ── 官方轨：DeepSeek API 原生适配（主轨）───────────────────────────────
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro

# ── 兼容轨：pi-ai deepseek 目录路由（双轨并存，可切换）──────────────────
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        modelOverrides:
          deepseek-v4-flash:
            reasoningEfforts:
              off: off
              max: max

# ── 主轨默认模型（omo 主 agent 用 Pro；轻量 agent 用 Flash，P4 在预设层细化）─
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

# ── P2: omo 技能目录（保留默认 project/user 根，追加 vendor 的 omo skills）──
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false
  config:
    includeDefaultRoots: true
    customSkillDirs:
      - !!js process.env.OMO_DSH_SKILLS_DIR || '/home/haroldzhao/dshProj/oh-my-openagent/.omo/port/omo-dsh/packages/omo-skills-plugin/skills'

# ── P3: omo MCP 服务器（stdio，经 dsh-mcp-client 插件实例化；新行使用 insert）──
- insert:
    - id: mcp-astgrep
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ast_grep
        transport: stdio
        command: node
        args:
          - !!js process.env.OMO_DSH_ASTGREP_CLI || '/home/haroldzhao/dshProj/oh-my-openagent/.omo/port/omo-dsh/packages/omo-mcp-astgrep/dist/cli.js'
        env:
          OMO_AST_GREP_SG_PATH: !!js process.env.OMO_AST_GREP_SG_PATH || '/home/haroldzhao/dshProj/oh-my-openagent/.omo/port/omo-dsh/.toolchain/node_modules/.bin/ast-grep'
        toolCallTimeoutMs: 60000
    # git_bash 按 omo 原设计仅限 Windows（run 只在 native Windows 可用），本 bundle 默认禁用；
    # Windows 部署可将本行改为 disabled: false 启用。
    - id: mcp-gitbash
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: git_bash
        transport: stdio
        command: node
        args:
          - !!js process.env.OMO_DSH_GITBASH_CLI || '/home/haroldzhao/dshProj/oh-my-openagent/.omo/port/omo-dsh/packages/omo-mcp-gitbash/dist/cli.js'
        toolCallTimeoutMs: 60000
    - id: mcp-lsp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsp
        transport: stdio
        command: node
        args:
          - !!js process.env.OMO_DSH_LSP_CLI || '/home/haroldzhao/dshProj/oh-my-openagent/.omo/port/omo-dsh/packages/omo-mcp-lsp/dist/cli.js'
          - mcp
        toolCallTimeoutMs: 60000
    # F10: codegraph 在二进制缺失时会尝试向 ~/.omo 自动 provision（沙盒/只读 HOME 下崩溃并把
    # 栈写入会话日志，干扰模型）。默认禁用；如需启用：本地安装 codegraph（.toolchain），
    # 设置 OMO_DSH_CODEGRAPH_CLI 环境变量，再把 disabled 改为 false。
    - id: mcp-codegraph
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: codegraph
        transport: stdio
        command: node
        args:
          - !!js process.env.OMO_DSH_CODEGRAPH_CLI || '/home/haroldzhao/dshProj/oh-my-openagent/.omo/port/omo-dsh/packages/omo-mcp-codegraph/dist/serve.js'
        toolCallTimeoutMs: 60000
