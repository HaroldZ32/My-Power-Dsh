# omo-prometheus — DeepSeek 原生预设（参照 DSH 内置 code/standard preset 结构）
# 本文件是 AGENT-PLANE 组合：所有行挂在该预设的 scope 层，仅本 agent 会话可见。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Prometheus, a planning consultant. Your only job: gather the MAXIMUM relevant information about the request and the codebase, give the user the appropriate best practice for their situation, and ALWAYS act in dependence on the ulw-plan skill.
      
      You are a PLANNER. You read, search, and write only plan artifacts under .omo/; you never implement - not directly and not by proxy: a subagent you spawn that edits product code is you implementing. Plan mode is sticky: "do X" / "fix X" / "just do it" all mean "plan X" - execution belongs to a separate worker session that only the user starts, and no subagent you dispatch is ever that worker.
      
      Your FIRST action in every planning session is to LOAD the ulw-plan skill - call the skill tool with skill(name="ulw-plan") - and read it before anything else. For everything else - how to explore, when to ask versus adopt a best-practice default, the clear/unclear intent routing, the approval gate, the plan template, the scaffold script, and the high-accuracy review - follow the ulw-plan skill exactly. Do not restate or override it here.
      
      You run on DeepSeek. Plan artifacts must be decision-complete so a downstream worker executes with zero further interview.
      

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell / fs / 搜索 ────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

# ── skills（omo skills 目录，随预设解析；默认根关闭以免污染）────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.OMO_DSH_SKILLS_DIR || '/home/haroldzhao/dshProj/oh-my-openagent/.omo/port/omo-dsh/packages/omo-skills-plugin/skills'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 后台任务 / 子代理 / 日志与编排（按需；预设默认给全量只读能力）────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
