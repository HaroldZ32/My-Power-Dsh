# mpd-dsh bundle plugin layer (Plan D): ADDITIVE-ONLY patch.
# Policy: never id-target rows owned by the stock DSH templates (llm-deepseek /
# agent-default-model / skill-filesystem / llm-pi-ai) — id-target replaces the
# WHOLE stock config and would wipe the stock model list / provider defaults.
# DeepSeek official provider ships with dsh-base as-is; this bundle adds only:
# MCP servers, the mpd-* plugins, the adopted agent-teams plugin, and the
# mpd-bootstrap preset provisioning.

- insert:
    - id: mcp-astgrep
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ast_grep
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_ASTGREP_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-astgrep/dist/cli.js")'
        env:
          MPD_AST_GREP_SG_PATH: !!js 'process.env.MPD_AST_GREP_SG_PATH || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/.bin/sg")'
        toolCallTimeoutMs: 60000
    # git_bash, by the upstream original design, is Windows-only (run is available only on native Windows); this bundle disables it by default;
    # Windows deployments can change this row to disabled: false to enable it.
    - id: mcp-gitbash
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: git_bash
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_GITBASH_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-gitbash/dist/cli.js")'
        toolCallTimeoutMs: 60000
    - id: mcp-lsp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsp
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_LSP_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-lsp/dist/cli.js")'
          - mcp
        toolCallTimeoutMs: 60000
    # CodeGraph MCP (F10 closed): MPD_CODEGRAPH_BIN resolves via baseUrl to the
    # node_modules/.bin/codegraph binary (optionalDependency @colbymchenry/codegraph);
    # project index init/skip-home discipline is handled by the mpd-codegraph plugin row below.
    - id: mcp-codegraph
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codegraph
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_CODEGRAPH_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-codegraph/dist/serve.js")'
        env:
          MPD_CODEGRAPH_BIN: !!js 'process.env.MPD_CODEGRAPH_BIN || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/.bin/codegraph")'
        toolCallTimeoutMs: 60000
    # Waveform-read MCPs for RTL verification (RTL dev phase-1). Both are
    # Waveform-read MCP rows (mcp-wave-mcp / mcp-traceweave) are NOT mounted by
    # default: they wrap EXTERNAL Python MCP servers (wave-mcp / TraceWeave)
    # that the user must install in a dedicated venv. A missing or mismatched
    # mcp SDK on the launching python crashed the MCP client at boot
    # (ModuleNotFoundError: No module named 'mcp.server.mcpserver'), taking the
    # whole GUI/agent down → boot-safety rule: optional rows stay COMMENTED
    # until the tools are installed and the env bins are pinned. To enable
    # (steps in docs/rtl-verif-guide.md §4):
    #   1) python3 -m venv ~/.venvs/wave-mcp && ~/.venvs/wave-mcp/bin/pip install "wave-mcp"
    #      python3 -m venv ~/.venvs/traceweave && ~/.venvs/traceweave/bin/pip install "traceweave-mcp"
    #   2) export MPD_DSH_WAVE_MCP_BIN=~/.venvs/wave-mcp/bin/wave-mcp
    #      export MPD_DSH_TRACEWEAVE_BIN=~/.venvs/traceweave/bin/traceweave-mcp
    #   3) uncomment the two example rows below (command resolves env-first,
    #      PATH second; keep SEPARATE venvs — SDK pin conflicts: wave-mcp needs
    #      mcp>=2, TraceWeave pins mcp==1.27.0).
    # - id: mcp-wave-mcp
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: wave_mcp
    #     transport: stdio
    #     command: !!js 'process.env.MPD_DSH_WAVE_MCP_BIN || "wave-mcp"'
    #     args:
    #       - "--session"
    #       - !!js 'process.env.MPD_DSH_WAVE_MCP_SESSION || (process.env.DSH_HOME ? process.env.DSH_HOME + "/wave-mcp" : ".wave-mcp")'
    #     toolCallTimeoutMs: 120000
    # - id: mcp-traceweave
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: traceweave
    #     transport: stdio
    #     command: !!js 'process.env.MPD_DSH_TRACEWEAVE_BIN || "traceweave-mcp"'
    #     # No env block: the EDA environment (VERDI_HOME/NOVAS_HOME/VCS_HOME +
    #     # license vars) is inherited from the dsh launching shell; docs instruct
    #     # exporting them there before starting dsh.
    #     toolCallTimeoutMs: 120000

# ── B-line plugins (self-written; production uses @mpd-dsh/<pkg> package names) ──
- insert:
    # Web-compat self-registration (mirrors @linxin666/dsh-web-ui-all's web-ui-compat
    # row): the bundle's web client loads only if a LOADER ENTRY named exactly
    # `@mpd-dsh/mpd` exists — client-modules resolves client rows against
    # `ctx.loader.entries()` entry names, and entry names come from a patch row's
    # `name` field. This self-row (loading the bundle's own no-op main plugin)
    # provides that entry; without it the agent-teams/workmate web client never
    # appears in the boot graph.
    - id: mpd-web-compat
      name: '@mpd-dsh/mpd'
    # mpd-config first: it provides the mpdConfig service that the rows below
    # read (apply-time config merges for tools/waterfalls).
    - id: mpd-config
      name: '@mpd-dsh/mpd/packages/mpd-config-plugin/dist/index.js'
    - id: mpd-tools
      name: '@mpd-dsh/mpd/packages/mpd-tools-plugin/dist/index.js'
      config:
        writeGuard: true
        truncateMaxBytes: 8192
    - id: mpd-modelchain
      name: '@mpd-dsh/mpd/packages/mpd-modelchain-plugin/dist/index.js'
    - id: mpd-roles
      name: '@mpd-dsh/mpd/packages/mpd-roles-plugin/dist/index.js'
    - id: mpd-ulw
      name: '@mpd-dsh/mpd/packages/mpd-ulw-plugin/dist/index.js'
      config:
        maxRounds: 3
    - id: mpd-hashline
      name: '@mpd-dsh/mpd/packages/mpd-hashline-plugin/dist/index.js'
      config:
        guardEditTools: true
    - id: mpd-boulder
      name: '@mpd-dsh/mpd/packages/mpd-boulder-plugin/dist/index.js'
    - id: mpd-comment-checker
      name: '@mpd-dsh/mpd/packages/mpd-comment-checker-plugin/dist/index.js'
      config:
        autoCheck: false
    - id: mpd-codegraph
      name: '@mpd-dsh/mpd/packages/mpd-codegraph-plugin/dist/index.js'
      config:
        autoInit: true
        initTimeoutMs: 60000
    - id: mpd-memory
      name: '@mpd-dsh/mpd/packages/mpd-memory-plugin/dist/index.js'
      config:
        vcs: git
    - id: mpd-workmate
      name: '@mpd-dsh/mpd/packages/mpd-workmate-plugin/dist/index.js'
    - id: mpd-bootstrap
      name: '@mpd-dsh/mpd/packages/mpd-bootstrap-plugin/dist/index.js'
    # RTL verification (Plan A, verification side): eight mpd_verif_* tools,
    # iverilog/verilator/vcs resolution via MPD_DSH_VERIF_*/PATH (never
    # vendored), cocotb lane under the project-local venv iron rule and the
    # VCS-only UVM lane; wave results hand off to mcp-wave-mcp/mcp-traceweave
    # when those rows are user-wired (graceful degrade otherwise). Details in
    # docs/rtl-verif-guide.md + packages/mpd-verif-plugin/README.md.
    - id: mpd-verif
      name: '@mpd-dsh/mpd/packages/mpd-verif-plugin/dist/index.js'

# ── Remote MCP rows (public services; network required, optional per use) ──
- insert:
    # The adopted team plugin is FIRST-CLASS MAIN CODE at
    # packages/mpd-agent-teams-plugin (MIT provenance; upstream
    # @nanmicoder/dsh-agent-teams 0.1.14) and loads through the bundle exports map:
    # pnpm-driven `dsh plugin add` never links a bundle's transitive dependencies
    # into the profile root, so a plain package-name row would silently self-disable.
    # Its server runtime closure is vendored at packages/mpd-agent-teams-plugin/_deps
    # (see scripts/vendor-agent-teams.mjs), so the row always resolves — no guard.
    - id: agent-teams
      name: '@mpd-dsh/mpd/packages/mpd-agent-teams-plugin/lib/index.js'
      config:
        stateDir: .mpd/team
        memberProvider: spawn
        memberMaxDepth: 1
        maxMembers: 16
        # SESSION-START TEAM RULE (binding): every qualifying session MUST begin
        # inside a team. mode=auto provisions the staged default team (profile
        # `mpd`, approval=required — nothing spawns until the user approves the
        # Web plan) at the session's first step when the session leads no team,
        # and injects the startup notice to the captain; presets: [mpd] scopes
        # the rule to mpd-preset sessions (sessions without any preset, e.g.
        # headless direct runs, are covered too), and subagent/member sessions
        # (they carry parentSession) never qualify. Enforcement is mechanical
        # (lib/session-start.js), not prompt guidance alone.
        sessionTeamPolicy:
          mode: auto
          profile: mpd
          presets:
            - mpd
          name: MPD Default
          approval: required
        # The OMO-origin agents become teammate instantiation templates for the
        # adopted dsh-agent-teams plugin (reusing its architecture + Web GUI).
        # One named profile `mpd` holds the full normal-named roster and
        # `taskPlanning: captain` means only the roster is fixed: the captain
        # designs the task DAG after a staged plan the user reviews in the panel.
        # /agent-teams --profile mpd <goal> instantiates the roster explicitly.
        profiles:
          mpd:
            description: "The OMO-origin specialist roster surfaced as normal-named teammate templates — captain-planned (roster only; the captain designs the DAG during the staged plan)."
            protocol: "Read-only members (Architect, Researcher, Planner, Explorer, Plan Reviewer, Vision Analyst) take requirements/review/analysis tasks only and never edit files. Workers (Senior Engineer, Junior Engineer, Deep Worker, Lead, Reviewer) take implementation/verification/integration. The captain leads, designs the DAG, and integrates results. Workmate reuse: before delegating a role task, consult mpd_workmate_list / mpd_workmate_match(task); if a workmate note matches well, delegate to that workmate (member name = workmate name, so its persona/memory are injected), otherwise initialize a fresh workmate with mpd_workmate_init — never force a weak note match."
            taskPlanning: captain
            # fallback.provider is ALWAYS deepseek-official (never the bare
            # "deepseek" compat-track provider): the original layered design
            # intended dsh-llm-pi-ai ("deepseek") as the degradation tier, but
            # that row is OFF by default (install-profile --with-compat-track is
            # gone) and the harness only registers deepseek-official
            # (dsh-llm-deepseek), so a "deepseek" fallback would fail with
            # NO_ADAPTER exactly when the fallback is needed. Models stay
            # unchanged (flash tier for Researcher/Explorer/Deep Worker/Junior
            # Engineer, pro tier for Plan Reviewer).
            members:
              - name: Architect
                role: architecture review / deep debugging / self-review
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Read-only architecture advisor. You advise, others execute — never edit files. Favor simplicity and existing patterns; give one clear recommendation with concise rationale and evidence."
              - name: Researcher
                role: code / open-source evidence search
                provider: deepseek-official
                model: deepseek-v4-flash
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Read-only researcher. Gather evidence from the codebase, AST/LSP and web sources; cite file:line and URLs; never edit files or invent findings."
              - name: Planner
                role: planning / task decomposition
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Read-only planner. Produce decision-complete, step-ordered plans with a checklist; never implement."
              - name: Explorer
                role: read-only codebase exploration
                provider: deepseek-official
                model: deepseek-v4-flash
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Read-only explorer. Answer with evidence and absolute file paths; never edit files."
              - name: Reviewer
                role: correctness / risk review
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Deep reviewer. Produce correctness/risk findings with evidence; recommend fixes but do not apply them."
              - name: Plan Reviewer
                role: work-plan QA review / UI-UX critique
                provider: deepseek-official
                model: deepseek-v4-flash
                fallback: { provider: deepseek-official, model: deepseek-v4-pro }
                executionPrompt: "Read-only plan reviewer. Verify plans are executable and references valid; reject only true blockers; UI/UX critique only when explicitly asked; never edit files."
              - name: Vision Analyst
                role: image / diagram analysis
                provider: deepseek-official
                model: deepseek-v4-flash-vision-exp
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Read-only vision analyst. Describe screenshots/diagrams precisely; never edit files or load anything by path."
              - name: Lead
                role: orchestration / integration
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Orchestrator. Plan the macro structure, delegate independent units in parallel, integrate and verify results."
              - name: Deep Worker
                role: autonomous goal-driven implementation
                provider: deepseek-official
                model: deepseek-v4-flash
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Autonomous deep worker. Receive goals, execute them end-to-end with tools, verify every change, report evidence-first."
              - name: Senior Engineer
                role: primary implementation
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Primary engineer. Plan small, execute with tools, keep diffs minimal, verify every change, report honestly."
              - name: Junior Engineer
                role: small mechanical changes
                provider: deepseek-official
                model: deepseek-v4-flash
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Fast executor. Small, well-scoped mechanical changes with quick verification; keep diffs tiny."
          rtl-ip:
            description: "RTL IP design workflow — four gated stages: requirements (Socratic clarification → req spec) → specification (user manual per skills/rtl-ip-flow templates; manual review gate) → code design (RTL + detail design manual + verification code/plan; consistency gate with spec-diff rollback) → dual-track verification (functional per user manual, coverage per design manual). Before any work the captain asks the user two opening questions: HDL language (Verilog/SV vs SpinalHDL/Chisel → which code engineer) and verification backend (open-source cocotb+verilator-cov / VCS UVM+urg / auto-adapt)."
            protocol: "RTL-IP FOUR-GATE FLOW (skills/rtl-ip-flow is the binding execution contract). STAGE 0: ask the user (one batch): HDL language → delegate code to 'RTL Code Engineer — Verilog/SV' (rtl-codestyle) or 'RTL Code Engineer — SpinalHDL'; verification backend → open-source (cocotb + verilator coverage), VCS (UVM + urg/fsdbreport), or auto-adapt (probe mpd_verif_backends). STAGE 1 REQUIREMENTS (Requirement Analyst, read-only by discipline): analyze the request text/input docs, Socratic-question the user until unambiguous, output question list + requirements summary; no design before the user answers. STAGE 2 SPEC (Spec Designer): settle the requirements spec (templates/req-spec.md), write the USER MANUAL strictly per templates/user-manual.md, deliver to the user and HALT — gate 1 is a manual user review; nothing may be coded before the user confirms the manual; revise and re-present until confirmed. STAGE 3 CODE (RTL Code Engineer of the chosen language, Verification Engineer in parallel): implement per the user manual under the style contract; write the DETAIL DESIGN MANUAL per templates/detail-design.md one-to-one with the code (no code inside the doc); write verification code + verification plan (templates/verification-plan.md) deriving test points from the user manual. Consistency rule: no non-essential difference between detail manual/code and the user manual — on real divergence, stash the stage-3 files (git stash / copy aside), re-run stage 2 to correct the user manual, get it confirmed, return and redo stage 3; never patch around the divergence. Gate 2: deliver code + detail manual + verification code/plan to the user and verification review, then halt. STAGE 4 VERIFY (Verification Engineer): track 1 functional per the user manual (cocotb lane or UVM lane per backend; all cases PASS); track 2 coverage per the detail design (verilator merge/report, or VCS urg + fsdbreport; plan targets met or justified). Dual-track report with evidence paths before ending. Human-facing deliverables are Chinese; agent-facing logs and commits stay English."
            taskPlanning: captain
            members:
              - name: Requirement Analyst
                role: requirements elicitation (read-only by discipline)
                provider: deepseek-official
                model: deepseek-v4-flash
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Read-only requirements analyst. Analyze the request text and input docs for the RTL IP, then drive Socratic clarification questions (feature set, interface/bus, registers, clocks/reset, performance targets, non-goals, acceptance criteria) until the intent is unambiguous. Output: question list + user answers + requirements summary. Never write files, never start design."
              - name: Spec Designer
                role: requirements spec + user manual (gate 1 owner)
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Spec designer. First settle the requirements spec (skills/rtl-ip-flow/templates/req-spec.md) from the analyst's summary, then write the USER MANUAL strictly per skills/rtl-ip-flow/templates/user-manual.md (intro, features, functional description with block diagram, software-config scenarios without code, register overview + per-register tables with access semantics aligned to the table, reset values consistent). Report the delivered manual path and wait for the manual review gate."
              - name: RTL Code Engineer — Verilog/SV
                role: RTL implementation (Verilog/SV lane)
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "RTL code engineer (Verilog/SystemVerilog). Implement the IP strictly per the confirmed user manual; code style contract = rtl-codestyle skill (verilog-generator/Erie: i_/o_/io_ prefixes, C_ parameters, 3-process FSM, ordered banners, trailing-aligned comments). Then write the DETAIL DESIGN MANUAL per skills/rtl-ip-flow/templates/detail-design.md, one-to-one with the code (module/interface/FSM/parameter mapping, no code inside the doc). Never diverge from the user manual; on divergence stop and report for the rollback procedure."
              - name: RTL Code Engineer — SpinalHDL
                role: RTL implementation (SpinalHDL/Chisel lane)
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "RTL code engineer (SpinalHDL/Chisel). Implement the IP strictly per the confirmed user manual, following the project's existing SpinalHDL conventions (RDC-pattern rules: no hardware-computed parameter defaults, no precision-losing resize, split register fields with named fieldAt, doc-sync after every change, no dangling signals). Then write the DETAIL DESIGN MANUAL per skills/rtl-ip-flow/templates/detail-design.md, one-to-one with the code. Never diverge from the user manual; on divergence stop and report."
              - name: Verification Engineer
                role: verification code + plan + dual-track verification
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "Verification engineer. In stage 3 (parallel with code): derive test points from the user manual, write the verification code and the verification plan per skills/rtl-ip-flow/templates/verification-plan.md; also run the manual-vs-code consistency check and report findings. In stage 4: dual-track verification — functional track per the user manual (cocotb lane or UVM lane per backend; all cases PASS), coverage track per the detail design (verilator coverage merge/report, or VCS urg + fsdbreport; plan targets met or justified). Report evidence paths; no silent target relaxing."
              - name: Reviewer
                role: correctness / risk review (gate support)
                provider: deepseek-official
                model: deepseek-v4-pro
                fallback: { provider: deepseek-official, model: deepseek-v4-flash }
                executionPrompt: "RTL-IP gate reviewer. Produce correctness/risk findings with evidence (file:line); verify manual-vs-code consistency and verification-plan coverage claims; recommend fixes but do not apply them. Review only; never edit files."
              - name: Plan Reviewer
                role: gated-plan and doc-consistency QA
                provider: deepseek-official
                model: deepseek-v4-flash
                fallback: { provider: deepseek-official, model: deepseek-v4-pro }
                executionPrompt: "Read-only plan reviewer for the RTL-IP flow. Verify the staged plan follows the four-gate flow (halts at manual gates, rollback procedure on divergence) and that documents map to their templates; reject only true blockers; never edit files."

- insert:
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        toolCallTimeoutMs: 60000
    - id: mcp-grepapp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: grep_app
        transport: streamable-http
        url: https://mcp.grep.app
        toolCallTimeoutMs: 60000
