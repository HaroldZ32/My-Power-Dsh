# mpd-dsh bundle plugin layer (Plan D): ADDITIVE-ONLY patch, plus ONE id-target
# (the preset-selection registry below).
# Policy: never id-target rows owned by the stock DSH templates (llm-deepseek /
# agent-default-model / skill-filesystem / llm-pi-ai) — id-target replaces the
# WHOLE stock config and would wipe the stock model list / provider defaults.
# DeepSeek official provider ships with dsh-base as-is; this bundle adds only:
# MCP servers, the mpd-* plugins, the OFFICIAL Agent Teams rows, and the
# agent-preset row that declares the `mpd` preset (the skill corpus is served by
# the mpd-bootstrap row's ctx.skills provider — nothing is copied into $DSH_HOME).
#
# ── HARNESS 0.1.7-rc.2: THE PRESET MODEL WAS REPLACED ───────────────────────
# `@deepseek-ai/dsh-agent-presets` — the directory/preset-root service this file
# used to id-target TWICE (the web plane row `agent-presets` and the dsh-tui plane
# row `dsh-tui-agent-presets`) — NO LONGER EXISTS in the installed harness. The
# role is split in two:
#   · `@deepseek-ai/dsh-agent-preset-registry` holds the deployment `default`;
#   · `@deepseek-ai/dsh-agent-preset` is ONE ROW PER PRESET, carrying that
#     preset's child entry list inline under `config.plugins`.
# The shipped presets follow exactly that shape: `@deepseek-ai/dsh-web-app`
# declares `presets/{standard,ptc,minimal,cordis}.patch.yml` and lists them as an
# ARRAY in its own `dsh.bundle.patch`. This bundle mirrors it: `package.json`'s
# `dsh.bundle.patch` is the array
#   [ "./packages/mpd-bundle/cordis.patch.yml", "./presets/mpd.patch.yml" ]
# and the second file inserts the `preset-mpd` row. The retired directory form
# (`presets/mpd/{preset.yml,agent.cordis.yml}`) is gone; its content lives in
# `presets/mpd.patch.yml` verbatim, comments included.
#
# FILE-URL -> PATH (win32). `baseUrl` is a file URL and every path below is derived from it with
# plain string ops (a `!!js` expression has no imports). The win32 spelling is `file://` + `/` +
# `C:/...`, so stripping `file://` alone leaves `/C:/...` - which the OS reads as a path on the
# CURRENT drive and then composes into a doubled drive prefix, so every MCP row of the bundle dies
# with `Cannot find module` (measured 2026-09-22, bundle-lifecycle boot). The drive-letter
# lookahead drops the third slash for a drive path ONLY, which leaves the POSIX `/home/...` form
# byte-identical. `decodeURIComponent` is the other half: a URL percent-escapes what a path does
# not, and a Windows short name carries a tilde (`.../ZHAO%7E1.YIN/...`), so the raw form named a
# directory that does not exist (measured 2026-09-22, second boot).

# ── preset selection: the deployment default is the mpd preset ──────────────
# An id-target (replace), not an insert: dsh-web-app's own patch inserts this row
# with `{ default: standard }`, and a second insert would be a duplicate loader
# entry id (fatal at boot: cordis-plugin-loader src/config/group.ts). Loader
# semantics that make the replace safe and COMPLETE: an id-target assigns only the
# keys this file carries and skips `id`, so the host row's own `disabled`
# expression survives; a missing id-target is a WARN (`patch: entry ... not
# found`), never an error, which is what keeps this row harmless in a composition
# that has no registry row at all. The installed registry declares exactly ONE
# config key — `default` — so restating it is complete; the retired
# `roots`/`modeSelectionEnabled` keys the old `@deepseek-ai/dsh-agent-presets` row
# accepted are NOT fields of this package and schemastery would silently drop
# them, so they are deliberately absent.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: mpd

# ── preset selection, dsh-tui plane: the SAME default, for the TUI composition ──
# MEASURED against `@deepseek-harness-tui/dsh-tui@0.11.1` (the first dsh-tui release whose
# peer ranges include `0.1.7-rc.2`; 0.10.1 and 0.10.2 stop at `0.1.5-rc.1`): the TUI mints
# its OWN registry row under the scoped id `dsh-tui-agent-preset-registry`
# (`name: '@deepseek-ai/dsh-agent-preset-registry'`, config `{ default: standard }`,
# disabled when an enabled `agent-preset-registry` entry already exists). A `dsh-tui`
# profile does NOT compose the dsh-web-app layer, so the id-target above is skipped there
# (`patch: entry agent-preset-registry not found`) and the TUI's row keeps
# `default: standard` — while NOTHING in that composition declares a `standard` preset
# (dsh-tui 0.11.1 ships no preset rows and no `presets/standard/`). Left alone, an mpd
# bundle installed into a TUI profile would therefore default every new session to a
# preset that does not exist. This id-target restores user decision D10 ("TUI sessions
# must default to the mpd preset") on the 0.1.7-rc.2 row model.
#
# SAFETY OF THE PAIR is the same argument the retired `agent-presets` /
# `dsh-tui-agent-presets` pair used: each id exists in exactly ONE composition (the web
# row comes from dsh-web-app's patch, the TUI row from dsh-tui's own), so the other
# profile only logs `patch: entry <id> not found` and applies nothing — no duplicate
# loader entry id is possible in either. Loader semantics that make the id-target safe
# and COMPLETE: an id-target is a per-key shallow override that skips `id` and assigns
# only the keys this file carries, so the TUI row's own compiled-DISABLED
# expression survives untouched (the row still disables itself when the web-plane
# `agent-preset-registry` is present, which is exactly why this override is harmless in
# that case); a missing id-target is a WARN, never an error; a duplicate entry id is
# fatal (cordis-plugin-loader src/config/group.ts).
- id: dsh-tui-agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: mpd

# ── runtime plugin dependency: the sidebar HOST the bundle's GUI needs ──────
# MEASURED DEFECT (evidence/install-deps/red-baseline/20260920T030832Z/result.json):
# a clean install of this bundle alone composed ZERO `dsh-better-sidebar` rows, so
# the `betterSidebar` service never existed and the bundle's two sidebar pages
# (mpd-agent-teams, mpd-workmate) registered nothing — the reported "the sidebar
# cannot display". The package is declared in the bundle manifest's `dependencies`
# (dsh-better-sidebar 0.19.0-alpha.1) and MOUNTED here.
#
# BOTH halves are required. The declaration alone never mounts anything: `dsh plugin
# add` reconciles only PROFILE-level dependencies into `dsh.profile.bundles`, so a
# bundle's dependency never becomes a layer and the package's own guarded patch never
# applies. The row alone would be boot-fatal when the module is unresolvable
# (`assertEntriesLoaded`). What makes the row resolvable is
# `@deepseek-ai/dsh-app-boot#healProfileModuleFallback`, which materializes the
# dependency closure of every non-installation bundle layer into
# `<profile>/node_modules` before the loader runs (measured; see the ledger under
# evidence/install-deps/implementation/**).
#
# THE ENTRY ID IS DELIBERATELY `mpd-better-sidebar`, byte-different from the
# package's own patch id (`better-sidebar`) and from the aggregate's id
# (`web-ui-better-sidebar`, @linxin666/dsh-web-all): a duplicate loader ENTRY ID is
# fatal even when the guard would have disabled one of the two, so we never reuse an
# id another layer may mint.
#
# THE GUARD IS ORDER-INDEPENDENT — the property that makes BOTH install orders safe.
# `[...ctx.loader.entries()]` is FORWARD-BLIND at first evaluation (measured: the
# same expression re-evaluates later with every entry visible, but `Entry.refresh()`
# returns early once `this.fiber` exists, so the FIRST evaluation decides), and
# @linxin666/dsh-web-all mounts the sidebar with an UNGUARDED row. A guard that read
# only the entry list would kill a boot that works today whenever the aggregate is
# installed AFTER this bundle. So the guard reads DECLARATIONS instead:
#   1. no `dsh-better-sidebar` resolvable from `<profile>/node_modules` -> disable
#      (degrade to "no sidebar" with one warning, never fail the boot);
#   2. `dsh-better-sidebar` is itself a declared `dsh.profile.bundles` layer -> its
#      own patch mounts it -> disable;
#   3. every OTHER bundle layer's `dsh.bundle.patch` is scanned for a MOUNT (the row rule
#      below). Self-exclusion is by IDENTITY (the layer whose `package.json` name is
#      `@mpd-dsh/mpd` is SKIPPED), never by a substring of our own row id (review R4);
#   4. EVERY other patch layer the loader composes is scanned the same way (review R1):
#      `<profileDir>/cordis.patch.yml`, `$DSH_HOME/cordis.patch.yml`
#      (`<profileDir>/../../cordis.patch.yml`) and every `--patch` overlay path
#      recovered from `process.argv` (both `--patch X` and `--patch=X`, repeatable).
#      A sidebar row in any of them under a DIFFERENT entry id is exactly the
#      `duplicate prefix route` boot-killer (requirements F3) and is now seen;
#   5. no enabled `@deepseek-ai/dsh-host-webserver` ENTRY -> disable. The web-plane
#      clause is fail-closed (review R3): the raw `options.disabled` node must be
#      absent or literally `false`, so a webserver row disabled by an expression is NOT
#      "present", and the `@deepseek-ai/dsh-web-app` layer no longer enables this row on
#      its own — the service the sidebar injects is the entry's, not the layer's.
#
# THE ROW RULE (repair F1, stated verbatim — this IS the contract a reviewer tests):
#   1. Strip YAML comments before matching (a `#` that is not inside quotes ends the
#      line's content).
#   2. Find candidate ROWS that name `dsh-better-sidebar` (the `name:` value, quoted or
#      bare).
#   3. A candidate counts as a MOUNT unless it carries a LITERAL `disabled: true`.
#   4. Unknown / `!!js`-valued `disabled` counts as a MOUNT (conservative: we back off
#      rather than risk a duplicate).
#   5. Any parsing doubt falls back to the CURRENT behaviour (treat as a mount ->
#      DISABLED).
# The bias direction is unchanged and deliberate — a false disable costs the sidebar (one
# log line, the session keeps running); a false enable kills the whole boot with
# `webserver: duplicate route`. What changed with repair F1 is only HOW a candidate is
# recognised inside those files: a comment that mentions the package, or a foreign row
# that is literally `disabled: true`, mounts nothing and no longer suppresses our only
# mount (the verification lane measured both as a SILENT loss of the sidebar). When in
# doubt this guard disables.
# PROFILE-DIR DERIVATION (win32). Clause 1 needs the PROFILE DIRECTORY itself, and `baseUrl` is
# that directory's own file URL (`file:///C:/.../profiles/web/`), so it is converted with
# `node:url.fileURLToPath` — never with `new URL('.', baseUrl).pathname`. On win32 that
# `pathname` is `/C:/Users/<u>/.dsh/profiles/web/`, and win32 `path.normalize` reads its leading
# `/` as the CURRENT drive root, so the check tested `\C:\Users\...\node_modules\dsh-better-sidebar`:
# `fs.existsSync` answered false for a sidebar that WAS resolvable, and clause 1 disabled this row
# on EVERY win32 profile with the reason above, which reads as "not installed" while the package
# sits in the profile (measured 2026-09-23, win32-x64 / node v24.21.0, both red and green under
# evidence/install-deps/sidebar-guard-win32/). That is the same doubled-drive-prefix class the
# FILE-URL header at the top of this file fixes for the path rows; `fileURLToPath` is used here
# rather than that string-op idiom because this scalar is YAML DOUBLE-quoted (the idiom's `\/`
# would need escaping there) and because a real path is what `fs` is handed.
# The whole guard is one try/catch that returns TRUE (disabled) on ANY throw, so the
# worst case is a missing sidebar, never a dead boot. It logs ONE line per distinct
# decision with the stable prefix `[mpd-better-sidebar] mount guard: ` — that line is
# how a verifier sees the decision in the boot log. Raw `e.options.disabled` is read
# on purpose: reading another entry's EVALUATED `disabled` getter re-enters its own
# `!!js` expression (measured: mutual recursion, stack overflow).
- insert:
    - id: mpd-better-sidebar
      name: dsh-better-sidebar
      disabled: !!js "(() => { const say = (decision, reason) => { try { const seen = globalThis.__mpdSidebarGuardSeen || (globalThis.__mpdSidebarGuardSeen = {}); const key = decision + '|' + reason; if (!seen[key]) { seen[key] = 1; console.warn('[mpd-better-sidebar] mount guard: ' + decision + ' - ' + reason) } } catch (e) {} }; try { const fs = process.getBuiltinModule('node:fs'); const path = process.getBuiltinModule('node:path'); const profileDir = path.normalize(process.getBuiltinModule('node:url').fileURLToPath(baseUrl)); const readJson = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')) } catch (e) { return null } }; const readText = (p) => { try { return fs.readFileSync(p, 'utf8') } catch (e) { return null } }; const SQ = String.fromCharCode(39); const DQ = String.fromCharCode(34); const HASH = String.fromCharCode(35); const LF = String.fromCharCode(10); const TAB = String.fromCharCode(9); const stripComments = (text) => { const out = []; for (const line of String(text).split(LF)) { let kept = ''; let quote = ''; for (const ch of line) { if (quote === '') { if (ch === HASH) { break } if (ch === SQ || ch === DQ) { quote = ch } } else if (ch === quote) { quote = '' } kept += ch } out.push(kept) } return out.join(LF) }; const unquote = (raw) => { const t = String(raw).trim(); if (t.length > 1 && (t.charAt(0) === SQ || t.charAt(0) === DQ) && t.charAt(t.length - 1) === t.charAt(0)) { return t.slice(1, -1) } return t }; const indentOf = (line) => { let i = 0; while (i < line.length && (line.charAt(i) === ' ' || line.charAt(i) === TAB)) { i++ } return i }; const keyOf = (line, key) => { let t = line; if (t.charAt(0) === '-' && t.charAt(1) === ' ') { t = t.slice(2) } const trimmed = t.trimStart(); if (!trimmed.startsWith(key + ':')) { return null } return trimmed.slice(key.length + 1).trim() }; const foreignRowMountsSidebar = (text) => { const stripped = stripComments(text); if (stripped.indexOf('dsh-better-sidebar') < 0) { return false } const rows = []; let current = null; for (const line of stripped.split(LF)) { if (line.trim() === '') { continue } const indent = indentOf(line); const body = line.slice(indent); const isItem = body.charAt(0) === '-' && (body.length === 1 || body.charAt(1) === ' '); if (isItem) { current = { indent, lines: [] }; rows.push(current) } if (current !== null && (isItem || indent > current.indent)) { current.lines.push({ indent, body }) } } let named = false; let mounting = false; for (const row of rows) { let nameValue = null; let nameIndent = -1; let disabledValue = null; let disabledIndent = -1; for (const entry of row.lines) { const nv = keyOf(entry.body, 'name'); if (nv !== null && (nameIndent < 0 || entry.indent < nameIndent)) { nameIndent = entry.indent; nameValue = nv } const dv = keyOf(entry.body, 'disabled'); if (dv !== null && (disabledIndent < 0 || entry.indent < disabledIndent)) { disabledIndent = entry.indent; disabledValue = dv } } if (nameValue === null || unquote(nameValue) !== 'dsh-better-sidebar') { continue } named = true; const literallyDisabled = disabledValue !== null && disabledIndent <= nameIndent && unquote(disabledValue).toLowerCase() === 'true'; if (!literallyDisabled) { mounting = true } } if (mounting) { return true } if (!named) { return true } return false }; const ownModules = path.join(profileDir, 'node_modules'); if (!fs.existsSync(path.join(ownModules, 'dsh-better-sidebar'))) { say('DISABLED', 'dsh-better-sidebar is not resolvable from the profile node_modules'); return true } const manifest = readJson(path.join(profileDir, 'package.json')); const bundles = manifest && manifest.dsh && manifest.dsh.profile && Array.isArray(manifest.dsh.profile.bundles) ? manifest.dsh.profile.bundles : []; if (bundles.indexOf('dsh-better-sidebar') >= 0) { say('DISABLED', 'dsh-better-sidebar is itself a declared bundle layer'); return true } for (const bundle of bundles) { const name = String(bundle); for (const dir of [path.join(ownModules, name), path.join(profileDir, '..', 'node_modules', name)]) { const other = readJson(path.join(dir, 'package.json')); if (!other) continue; if (other.name === '@mpd-dsh/mpd') continue; const rel = other.dsh && other.dsh.bundle ? other.dsh.bundle.patch : undefined; if (typeof rel !== 'string') continue; const text = readText(path.join(dir, rel)); if (text !== null && foreignRowMountsSidebar(text)) { say('DISABLED', 'bundle layer ' + name + ' already mounts it in its own patch'); return true } } } const argv = Array.isArray(process.argv) ? process.argv : []; const overlays = []; for (let i = 0; i < argv.length; i++) { const arg = typeof argv[i] === 'string' ? argv[i] : ''; if (arg === '--patch' && typeof argv[i + 1] === 'string') { overlays.push(argv[i + 1]) } else if (arg.indexOf('--patch=') === 0) { overlays.push(arg.slice(8)) } } const layers = [path.join(profileDir, 'cordis.patch.yml'), path.join(profileDir, '..', '..', 'cordis.patch.yml')]; if (typeof process.env.DSH_HOME === 'string' && process.env.DSH_HOME !== '') { layers.push(path.join(process.env.DSH_HOME, 'cordis.patch.yml')) } for (const overlay of overlays) { layers.push(path.resolve(overlay)) } for (const layer of layers) { const text = readText(layer); if (text !== null && foreignRowMountsSidebar(text)) { say('DISABLED', 'patch layer ' + layer + ' already mounts it'); return true } } const entries = [...ctx.loader.entries()]; const hasWebEntry = entries.some((e) => e.options && e.options.name === '@deepseek-ai/dsh-host-webserver' && (e.options.disabled === undefined || e.options.disabled === false)); if (!hasWebEntry) { say('DISABLED', 'no enabled @deepseek-ai/dsh-host-webserver entry in this composition'); return true } say('ENABLED', 'web plane present and no other layer mounts dsh-better-sidebar'); return false } catch (e) { try { console.warn('[mpd-better-sidebar] mount guard: DISABLED - guard threw ' + String(e && e.message ? e.message : e)) } catch (e2) {} return true } })()"

- insert:
    # B8 (wave 2): this row names NO binary path any more. It launches
    # packages/mpd-mcp-astgrep/launch.mjs, which resolves the binary
    # bundle-relatively (env pin -> $MPD_AST_GREP_BIN_DIR -> createRequire of the
    # optionalDependency -> <bundle>/.toolchain/node_modules/.bin/ast-grep|sg) and
    # sets MPD_AST_GREP_SG_PATH only when the caller left it unset, before the
    # adopted server reads it. The old `env.MPD_AST_GREP_SG_PATH = <baseUrl>/node_modules/.bin/sg`
    # pin was packed-layout-only AND named the deprecated `sg` wrapper (exit 1);
    # a mounting boot with no env pin is the gate (never `--dump-config`).
    - id: mcp-astgrep
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ast_grep
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_ASTGREP_CLI || ((typeof baseUrl === "string" ? decodeURIComponent(baseUrl.replace(/^file:\/\/\/(?=[A-Za-z]:)/, "").replace(/^file:\/\//, "")).replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-astgrep/launch.mjs")'
        toolCallTimeoutMs: 60000
    # git_bash, by the upstream original design, is Windows-only (run is available only on native Windows); this bundle disables it by default;
    # Windows deployments can change this row to disabled: false to enable it.
    - id: mcp-gitbash
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: git_bash
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_GITBASH_CLI || ((typeof baseUrl === "string" ? decodeURIComponent(baseUrl.replace(/^file:\/\/\/(?=[A-Za-z]:)/, "").replace(/^file:\/\//, "")).replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-gitbash/dist/cli.js")'
        toolCallTimeoutMs: 60000
    - id: mcp-lsp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsp
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_LSP_CLI || ((typeof baseUrl === "string" ? decodeURIComponent(baseUrl.replace(/^file:\/\/\/(?=[A-Za-z]:)/, "").replace(/^file:\/\//, "")).replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-lsp/dist/cli.js")'
          - mcp
        toolCallTimeoutMs: 60000
    # CodeGraph MCP (B8, wave 2): this row names NO binary path any more. It
    # launches packages/mpd-mcp-codegraph/launch.mjs, which resolves the binary
    # bundle-relatively (env pin -> createRequire of the optionalDependency ->
    # <bundle>/.toolchain/node_modules/.bin/codegraph) and sets MPD_CODEGRAPH_BIN
    # only when the caller left it unset, then calls runCodegraphServe() (serve.js
    # self-starts only when IT is argv[1]). The old env pin was packed-layout-only,
    # and a wrong MPD_CODEGRAPH_BIN disables the adopted bundled/provisioned/PATH/
    # download chain entirely. Project index init/skip-home discipline is handled
    # by the mpd-codegraph plugin row below.
    - id: mcp-codegraph
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codegraph
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_CODEGRAPH_CLI || ((typeof baseUrl === "string" ? decodeURIComponent(baseUrl.replace(/^file:\/\/\/(?=[A-Za-z]:)/, "").replace(/^file:\/\//, "")).replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-codegraph/launch.mjs")'
        toolCallTimeoutMs: 60000
    # Waveform-read MCP rows (mcp-wave-mcp / mcp-traceweave) are NOT mounted by
    # default: they wrap EXTERNAL Python MCP servers (wave-mcp / TraceWeave)
    # that the user installs with pipx or plain pip — NO venv required (the
    # venv iron rule belongs to cocotb only; pipx keeps the two tools isolated
    # on its own if their mcp SDK versions ever conflict). A missing or
    # mismatched mcp SDK on the launching python crashed the MCP client at boot
    # (ModuleNotFoundError: No module named 'mcp.server.mcpserver'), taking the
    # whole GUI/agent down → boot-safety rule: optional rows stay COMMENTED
    # until the tools are installed and the env bins are pinned. To enable:
    #   1) pipx install wave-mcp && pipx install traceweave-mcp
    #      (or run node scripts/install-mcp.mjs --with-wave --activate-wave)
    #   2) export MPD_DSH_WAVE_MCP_BIN=$(command -v wave-mcp)
    #      export MPD_DSH_TRACEWEAVE_BIN=$(command -v traceweave-mcp)
    #   3) uncomment the two example rows below (command resolves env-first,
    #      PATH second).
    # - id: mcp-wave-mcp
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: wave_mcp
    #     transport: stdio
    #     command: !!js 'process.env.MPD_DSH_WAVE_MCP_BIN || "wave-mcp"'
    #     # NO --session at startup: wave-mcp 0.1.1 treats --session as an
    #     # OPTIONAL auto-open and exits with FileNotFoundError when the dir has
    #     # no session.json yet. The plugin creates the session after a sim run
    #     # via mcp__wave_mcp__prepare_session.
    #     toolCallTimeoutMs: 120000
    # - id: mcp-traceweave
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: traceweave
    #     transport: stdio
    #     command: !!js 'process.env.MPD_DSH_TRACEWEAVE_BIN || "traceweave-mcp"'
    #     # No env block: the EDA environment (VERDI_HOME/NOVAS_HOME/VCS_HOME +
    #     # license vars) is inherited from the dsh launching shell; docs instruct
    #     # exporting them there before starting dsh.
    #     toolCallTimeoutMs: 120000

# ── B-line plugins (self-written; production uses @mpd-dsh/<pkg> package names) ──
- insert:
    # Web-compat self-registration (mirrors @linxin666/dsh-web-ui-all's web-ui-compat
    # row): the bundle's web client loads only if a LOADER ENTRY named exactly
    # `@mpd-dsh/mpd` exists — client-modules resolves client rows against
    # `ctx.loader.entries()` entry names, and entry names come from a patch row's
    # `name` field. This self-row (loading the bundle's own no-op main plugin)
    # provides that entry; without it the agent-teams/workmate web client never
    # appears in the boot graph.
    - id: mpd-web-compat
      name: '@mpd-dsh/mpd'
    # mpd-dsh-adapter FIRST: it is the bundle's ONLY contact surface with the
    # harness tool/agent/skill/preset seams (ctx.tools register/guard/execute/
    # post-execute, ctx.subagents.start, ctx.skills.registerProvider,
    # ctx.agentPresets.resolve). Every mpd row below calls through it, so a
    # harness release that reshapes a seam is absorbed in that one package.
    - id: mpd-dsh-adapter
      name: '@mpd-dsh/mpd/packages/mpd-dsh-adapter-plugin/dist/index.js'
    # mpd-config next: it provides the mpdConfig service that the rows below
    # read (apply-time config merges for tools/waterfalls).
    - id: mpd-config
      name: '@mpd-dsh/mpd/packages/mpd-config-plugin/dist/index.js'
      # An EMPTY config block is kept so the row's config is explicit. What actually makes the mpd
      # knobs editable is the plugin's exported `Config` schema with its knobs flagged volatile: the
      # settings editor lists an entry only when `volatileForm(entry.fiber.runtime.Config)` is
      # defined (verified on a real boot: describe() went 18 -> 19 entries, `include:mpd-config`
      # among them).
      config: {}
    # Team watchdog (w3 core): per-step/per-tool heartbeat store for members AND the
    # captain, the configurable WARN→ESCALATE machine over the `mpd` namespace's
    # watchdog.* knobs, the atomic restorable scene snapshot, and the durable
    # watchdogHold + incident/read-watermark sidecars written BESIDE the adopted
    # `team.json` (that record keeps its single writer, state.js). It owns its own
    # `session-watchdog-hold`/`-resume` actions; wiring the adopted dispatch gates
    # that honour a hold is a later task, so this row registers the contract only.
    # HOST plane on purpose: a preset row's listeners are scoped to one agent, so a
    # preset-mounted tick could not witness a wedged CAPTAIN (AC-9).
    - id: mpd-team-watchdog
      name: '@mpd-dsh/mpd/packages/mpd-team-watchdog-plugin/dist/index.js'
      config:
        # The ROW layer of the T-18 three-layer defaults table: every value here must equal
        # `packages/mpd-team-watchdog-plugin/src/machine.ts` `WATCHDOG_DEFAULTS` and
        # `packages/mpd-config-plugin/src/settings-schema.ts` `SettingsSchema.watchdog`. A
        # composition that writes no `watchdog` section in the `mpd` namespace keeps these.
        # A settings edit reaches the RUNNING engine only through the settings-document
        # re-read (`engine.ts` `onSettingsDocumentUpdated`); a `.mpd/mpd.jsonc` edit is read
        # once at plugin mount, so it applies at the next dsh boot and never mid-process.
        stateDir: '.mpd/team'
        warnSilenceMs: 600000
        tickIntervalMs: 15000
        warnStreakToEscalate: 6
        actionOnEscalate: warn-only
        toolInFlightMaxMs: 900000
        holdTtlMs: 900000
    - id: mpd-tools
      name: '@mpd-dsh/mpd/packages/mpd-tools-plugin/dist/index.js'
      config:
        writeGuard: true
        truncateMaxBytes: 8192
    - id: mpd-modelchain
      name: '@mpd-dsh/mpd/packages/mpd-modelchain-plugin/dist/index.js'
    # mpd-ext: the extension registry — it provides the `mpdExtensions` service and the
    # four model-facing tools (mpd_ext_list / mpd_ext_show / mpd_flow_list / mpd_flow_show).
    # POSITION (bundle-patch change, plan [REV3] §1.4): after mpd-dsh-adapter and mpd-config,
    # directly above mpd-roles — its first consumer. Row order is deliberately NOT the
    # dependency mechanism here (docs/design.md: a sibling-provided service is read
    # lazily at tool-execute time; the dependency mechanism that exists is `inject`), so the
    # row works anywhere in this band and the band documents the intended direction:
    #   · ABOVE mpd-dsh-adapter the row's apply-time `ctx.get("mpdDsh")` finds no mounted
    #     adapter and takes the `?? createDshAdapter(ctx)` fallback — the hazard, and the fix
    #     for it, are described ONCE in the canonical note at
    #     packages/mpd-ext-plugin/src/index.ts (resolveAdapter) and are NOT restated here; this
    #     bullet only states the placement rule. The branch now warns once per apply
    #     (`adapterIdentity=fallback:createDshAdapter`) instead of staying silent, so a
    #     misordered composition is visible in a boot log.
    #   · BELOW mpd-roles inverts the direction: today mpd-roles resolves the service with a
    #     per-call `ctx.get("mpdExtensions")`, but any later conversion of that lazy get into
    #     a hard `inject: ["mpdExtensions"]` would make mpd-roles a FATAL `pending` loader
    #     entry (the measured class that takes the whole plugin tree down) AND lose every
    #     extension-contributed role, because the provider row applies after its consumer.
    # `quiet` is the plugin's ONLY config key (MpdExtPluginConfig); false keeps the one-line
    # apply summary.
    - id: mpd-ext
      name: '@mpd-dsh/mpd/packages/mpd-ext-plugin/dist/index.js'
      config:
        quiet: false
    - id: mpd-roles
      name: '@mpd-dsh/mpd/packages/mpd-roles-plugin/dist/index.js'
    - id: mpd-ulw
      name: '@mpd-dsh/mpd/packages/mpd-ulw-plugin/dist/index.js'
      config:
        maxRounds: 3
    - id: mpd-hashline
      name: '@mpd-dsh/mpd/packages/mpd-hashline-plugin/dist/index.js'
      config:
        guardEditTools: true
    - id: mpd-boulder
      name: '@mpd-dsh/mpd/packages/mpd-boulder-plugin/dist/index.js'
    - id: mpd-comment-checker
      name: '@mpd-dsh/mpd/packages/mpd-comment-checker-plugin/dist/index.js'
      config:
        autoCheck: false
    - id: mpd-codegraph
      name: '@mpd-dsh/mpd/packages/mpd-codegraph-plugin/dist/index.js'
      config:
        autoInit: true
        initTimeoutMs: 60000
    - id: mpd-memory
      name: '@mpd-dsh/mpd/packages/mpd-memory-plugin/dist/index.js'
      config:
        vcs: git
    - id: mpd-workmate
      name: '@mpd-dsh/mpd/packages/mpd-workmate-plugin/dist/index.js'
    # Compacts a FINISHED team's members (every task terminal AND every member idle).
    # Members only — the captain is compacted by the human /compact command. The engine is
    # resolved per member through that member's OWN scoped context; the host-plane engine is
    # a different object serving a different realm (measured: sameObject false), so the
    # lookup lives in ONE adapter helper. Audit lands under <workspace>/.mpd/team-compact/;
    # this row never writes .mpd/team (that state belongs to the agent-teams plugin).
    - id: mpd-team-tools
      name: '@mpd-dsh/mpd/packages/mpd-team-tools-plugin/dist/index.js'
    - id: mpd-team-compact
      name: '@mpd-dsh/mpd/packages/mpd-team-compact-plugin/dist/index.js'
    # Bundle asset provisioning (no home writes since 0.3.0): registers the
    # <bundle>/skills corpus as a ctx.skills provider (rank 600 "bundled", below
    # project/custom/user roots) and removes the version-stamped copies that
    # bundle <= 0.2.6 left in $DSH_HOME/skills + $DSH_HOME/.agent-presets.
    # The preset side is served by the agent-presets row at the top of this file.
    - id: mpd-bootstrap
      name: '@mpd-dsh/mpd/packages/mpd-bootstrap-plugin/dist/index.js'
    # DSH-TUI edition (D1/D2/D6/D10): the TUI-native surface package for this
    # bundle. It binds the host's activation-gated UI service seams (tuiStatus,
    # tuiRenderers, tuiSettingsSections, tuiScenes, tuiCommandTrees,
    # tuiShortcuts, tuiDialogs) and probes every one of them with
    # `ctx.get(id, false)` + warn-once degrade, so under a profile that provides
    # none of them (web/headless) the row degrades instead of taking the boot
    # down. The same package's admission facet is declared ONCE, bundle-level, by
    # dsh-plugin.json at the repo root (`facets.host.entry` = the module below);
    # the package ships NO cordis.patch.yml of its own, so this row is the only
    # mount and no composition can duplicate the `mpd-tui` loader entry id
    # (verify-rows-parity + the boot-log scan are the gates).
    - id: mpd-tui
      name: '@mpd-dsh/mpd/packages/mpd-tui-plugin/dist/index.js'

# ── OFFICIAL Agent Teams rows (harness 0.1.7-rc.2) ──────────────────────────
# The bundle's team capability is the OFFICIAL plugin set, not a vendored body:
#   @deepseek-ai/dsh-experimental-agent-team          -> ctx.agentTeams (TeamService:
#       implicit-root roster, durable peer mailbox, shared task DAG)
#   @deepseek-ai/dsh-experimental-tool-agent-team     -> the scoped model-facing tools
#       spawn_teammate / send_message / list_agents / wait_agent / interrupt_agent /
#       team_task_create|list|get|update + the `team:policy` prompt section
#   @deepseek-ai/dsh-experimental-client-ui-agent-team -> the Web roster, task board
#       and teammate navigation
# All three are declared in this package's `dependencies`, so
# `@deepseek-ai/dsh-app-boot#healProfileModuleFallback` materializes them into
# `<profile>/node_modules` before the loader runs and the rows always resolve (the
# `dsh-better-sidebar` pattern: the declaration alone mounts nothing, and a row
# alone would be boot-fatal when the module is unresolvable).
#
# ENTRY IDS ARE mpd-OWNED ON PURPOSE. `@deepseek-ai/dsh-experimental-agent-team-profile`
# mounts the same three packages under the ids `agent-team` / `tool-agent-team` /
# `ui-agent-team`, and a duplicate loader entry id is FATAL even when one side is
# disabled. mpd-prefixed ids keep the two layers installable side by side.
#
# `freshProvider`/`forkProvider` are the harness defaults (`spawn` / `fork`) and
# the official defaults. They are restated so a reader sees the resolution: the
# official TeamService forwards ONLY `{ prompt, parent }` to
# `ctx.subagents.startContinuable`, so a subagent provider cannot inject a
# per-teammate model route, persona or tool filter for a continuable teammate.
# That reduction is recorded in `docs/plan-0.1.7-adaptation.md` §3; the roster's
# model slots survive on the one-shot consult path, and its read-only discipline
# is re-implemented as a tool guard by mpd-roles.
#
# The official profile bundle ALSO disables `tool-subagent`,
# `tool-subagent-control`, `tool-subagent-list-agents` and `tool-subagent-fork`.
# This bundle deliberately does NOT: the mpd preset mounts direct delegation as
# well, exactly as it did before, so a session keeps both the one-shot `subagent`
# path and the durable team path.
- insert:
    - id: mpd-agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 16
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 32768
        disposalTimeoutMs: 5000

    # THE ROSTER PROVIDER: registers `mpd-roster`, the subagent provider that applies an mpd
    # teamModels slot route to a teammate. It must be mounted for the redirect below to resolve.
    - id: mpd-roster-provider
      name: '@mpd-dsh/mpd/packages/mpd-roster-provider-plugin/dist/index.js'
      config:
        baseProvider: spawn
    - id: mpd-tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        # POINT THE OFFICIAL TEAM TOOL AT THE ROSTER PROVIDER: this is the whole redirect. The
        # tool's own `provider` argument is ignored by its implementation, so ROW CONFIG is
        # the only place a per-member route can be introduced without forking the plugin.
        freshProvider: mpd-roster
        forkProvider: fork

    - id: mpd-ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

# ── Remote MCP rows (public services; network required, optional per use) ──
- insert:
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        toolCallTimeoutMs: 60000
    - id: mcp-grepapp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: grep_app
        transport: streamable-http
        url: https://mcp.grep.app
        toolCallTimeoutMs: 60000
