# mpd-dsh bundle plugin layer (Plan D): ADDITIVE-ONLY patch.
# Policy: never id-target rows owned by the stock DSH templates (llm-deepseek /
# agent-default-model / skill-filesystem / llm-pi-ai) — id-target replaces the
# WHOLE stock config and would wipe the stock model list / provider defaults.
# DeepSeek official provider ships with dsh-base as-is; this bundle adds only:
# MCP servers, the mpd-* plugins, the adopted agent-teams plugin, and the
# mpd-bootstrap preset provisioning.

- insert:
    - id: mcp-astgrep
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ast_grep
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_ASTGREP_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-astgrep/dist/cli.js")'
        env:
          OMO_AST_GREP_SG_PATH: !!js 'process.env.OMO_AST_GREP_SG_PATH || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/.bin/sg")'
        toolCallTimeoutMs: 60000
    # git_bash, by the upstream original design, is Windows-only (run is available only on native Windows); this bundle disables it by default;
    # Windows deployments can change this row to disabled: false to enable it.
    - id: mcp-gitbash
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: git_bash
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_GITBASH_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-gitbash/dist/cli.js")'
        toolCallTimeoutMs: 60000
    - id: mcp-lsp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsp
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_LSP_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-lsp/dist/cli.js")'
          - mcp
        toolCallTimeoutMs: 60000
    # CodeGraph (re-enable after the F10 regression): point OMO_CODEGRAPH_BIN to the local toolchain's codegraph,
    # avoiding the serve.js crash when it tries to auto-provision to ~/.omo; index initialization is handled by the in-house mpd-codegraph plugin
    # (in production this bundle provides it via @mpd-dsh/mpd-codegraph-plugin; QA mounts it by absolute path through an overlay).
    - id: mcp-codegraph
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codegraph
        transport: stdio
        command: node
        args:
          - !!js 'process.env.MPD_DSH_CODEGRAPH_CLI || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/@mpd-dsh/mpd/packages/mpd-mcp-codegraph/dist/serve.js")'
        env:
          OMO_CODEGRAPH_BIN: !!js 'process.env.OMO_CODEGRAPH_BIN || ((typeof baseUrl === "string" ? baseUrl.replace(/^file:\/\//, "").replace(/\/+$/, "") : "") + "/node_modules/.bin/codegraph")'
        toolCallTimeoutMs: 60000

# ── B-line plugins (self-written; production uses @mpd-dsh/<pkg> package names) ──
- insert:
    - id: mpd-tools
      name: '@mpd-dsh/mpd/packages/mpd-tools-plugin/dist/index.js'
      config:
        writeGuard: true
        truncateMaxBytes: 8192
    - id: mpd-modelchain
      name: '@mpd-dsh/mpd/packages/mpd-modelchain-plugin/dist/index.js'
    - id: mpd-ulw
      name: '@mpd-dsh/mpd/packages/mpd-ulw-plugin/dist/index.js'
      config:
        maxRounds: 3
    - id: mpd-team
      name: '@mpd-dsh/mpd/packages/mpd-team-plugin/dist/index.js'
    - id: mpd-hashline
      name: '@mpd-dsh/mpd/packages/mpd-hashline-plugin/dist/index.js'
      config:
        guardEditTools: true
    - id: mpd-boulder
      name: '@mpd-dsh/mpd/packages/mpd-boulder-plugin/dist/index.js'
    - id: mpd-config
      name: '@mpd-dsh/mpd/packages/mpd-config-plugin/dist/index.js'
    - id: mpd-comment-checker
      name: '@mpd-dsh/mpd/packages/mpd-comment-checker-plugin/dist/index.js'
      config:
        autoCheck: false
    - id: mpd-memory
      name: '@mpd-dsh/mpd/packages/mpd-memory-plugin/dist/index.js'
      config:
        vcs: git
    - id: mpd-bootstrap
      name: '@mpd-dsh/mpd/packages/mpd-bootstrap-plugin/dist/index.js'

# ── Remote MCP rows (public services; network required, optional per use) ──
- insert:
    - id: agent-teams
      name: '@nanmicoder/dsh-agent-teams'
      config:
        stateDir: .mpd/team
        memberProvider: spawn
        memberMaxDepth: 1

- insert:
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        toolCallTimeoutMs: 60000
    - id: mcp-grepapp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: grep_app
        transport: streamable-http
        url: https://mcp.grep.app
        toolCallTimeoutMs: 60000
